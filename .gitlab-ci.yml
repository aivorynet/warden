stages: [check, build, package, release]

variables:
  CARGO_TERM_COLOR: always

.rust:
  stage: check
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace

check:linux:
  extends: .rust
  image: rust:1.95
  tags: [docker]
  before_script:
    - rustup component add rustfmt clippy

check:macos:
  extends: .rust
  image: macos-14-xcode-15
  tags: [macos]
  before_script:
    - curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0 --profile minimal -c rustfmt -c clippy
    - source "$HOME/.cargo/env"

check:windows:
  extends: .rust
  tags: [windows]
  before_script:
    - Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - ./rustup-init.exe -y --default-toolchain 1.95.0 --profile minimal -c rustfmt -c clippy
    - $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"

deny:
  stage: check
  image: rust:1.95
  tags: [docker]
  script:
    - cargo install cargo-deny --locked
    - cargo deny check

# ---- Release: runs on a tag v* only. Desktop bundles (Tauri) build on GitHub only. ----
# Signing is optional: the jobs skip it when the CI/CD variables are absent.
#   Windows: WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD
#   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID

.release-rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

.build-unix:
  extends: .release-rules
  stage: build
  script:
    - NAME="aivory-warden-$TARGET"
    - cargo build --release --locked --target "$TARGET" -p aivory-warden
    - mkdir -p "dist/$NAME"
    - cp "target/$TARGET/release/aivory-warden" "target/$TARGET/release/awd" LICENSE README.md "dist/$NAME/"
    - (cd dist && tar czf "$NAME.tar.gz" "$NAME" && rm -rf "$NAME")
  artifacts:
    paths: [dist/]
    expire_in: 1 week

build:linux-x64:
  extends: .build-unix
  image: rust:1.95
  tags: [docker]
  variables:
    TARGET: x86_64-unknown-linux-gnu

build:linux-arm64:
  extends: .build-unix
  image: rust:1.95
  tags: [docker]
  variables:
    TARGET: aarch64-unknown-linux-gnu
    CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
    - rustup target add aarch64-unknown-linux-gnu

.build-macos:
  extends: .build-unix
  image: macos-14-xcode-15
  tags: [macos]
  before_script:
    - curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0 --profile minimal -t "$TARGET"
    - source "$HOME/.cargo/env"
  after_script:
    # Optional signing and notarization. Skipped without the variables.
    - |
      if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_ID" ]; then
        kc="$TMPDIR/warden.keychain-db"
        echo "$APPLE_CERTIFICATE" | base64 --decode > "$TMPDIR/cert.p12"
        security create-keychain -p tmp "$kc" && security unlock-keychain -p tmp "$kc"
        security import "$TMPDIR/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
        security set-key-partition-list -S apple-tool:,apple: -k tmp "$kc"
        security list-keychains -d user -s "$kc" login.keychain
        rel="target/$TARGET/release"
        for f in aivory-warden awd; do codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$rel/$f"; done
        (cd "$rel" && zip "$TMPDIR/notarize.zip" aivory-warden awd)
        xcrun notarytool submit "$TMPDIR/notarize.zip" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
      else
        echo "apple signing skipped: no secrets"
      fi

build:macos-arm64:
  extends: .build-macos
  variables:
    TARGET: aarch64-apple-darwin

build:macos-x64:
  extends: .build-macos
  variables:
    TARGET: x86_64-apple-darwin

.build-windows:
  extends: .release-rules
  stage: build
  tags: [windows]
  before_script:
    - Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - ./rustup-init.exe -y --default-toolchain 1.95.0 --profile minimal -t $env:TARGET
    - $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
  script:
    - $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
    - $name = "aivory-warden-$env:TARGET"
    - cargo build --release --locked --target $env:TARGET -p aivory-warden
    - $rel = "target/$env:TARGET/release"
    - |
      if ($env:WINDOWS_CERT_PFX_BASE64) {
        $pfx = Join-Path $env:TEMP 'cert.pfx'
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
        $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
        foreach ($f in 'aivory-warden.exe', 'awd.exe') {
          & $signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 "$rel/$f"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed for $f" }
        }
        Remove-Item $pfx
      } else { Write-Host 'authenticode signing skipped: no secrets' }
    - New-Item -ItemType Directory -Force "dist/$name" | Out-Null
    - Copy-Item "$rel/aivory-warden.exe", "$rel/awd.exe", LICENSE, README.md "dist/$name/"
    - Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
    - Remove-Item -Recurse -Force "dist/$name"
  artifacts:
    paths: [dist/]
    expire_in: 1 week

build:windows-x64:
  extends: .build-windows
  variables:
    TARGET: x86_64-pc-windows-msvc

build:windows-arm64:
  extends: .build-windows
  allow_failure: true # best effort
  variables:
    TARGET: aarch64-pc-windows-msvc

build:extension:
  extends: .release-rules
  stage: build
  image: node:22
  tags: [docker]
  script:
    - cd extension && npm ci && npm run build
    - mkdir -p ../dist && apt-get update -qq && apt-get install -y -qq zip
    - cd dist && zip -r ../../dist/aivory-warden-edge-extension.zip .
  artifacts:
    paths: [dist/]
    expire_in: 1 week

package:
  extends: .release-rules
  stage: package
  image: debian:stable-slim
  tags: [docker]
  needs:
    - build:linux-x64
    - build:linux-arm64
    - build:macos-arm64
    - build:macos-x64
    - build:windows-x64
    - job: build:windows-arm64
      optional: true
    - build:extension
  script:
    - apt-get update -qq && apt-get install -y -qq zip curl
    - cp packaging/install.sh packaging/install.ps1 dist/
    - (cd dist && sha256sum -- * > SHA256SUMS)
    - bash packaging/render-packages.sh "${CI_COMMIT_TAG#v}" dist packages
    - (cd packages && zip -r ../dist/aivory-warden-packages.zip winget homebrew scoop)
    - |
      for f in dist/*; do
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f"           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aivory-warden/$CI_COMMIT_TAG/$(basename "$f")"
      done
  artifacts:
    paths: [dist/]
    expire_in: 1 month

release:
  extends: .release-rules
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags: [docker]
  needs: [package]
  script:
    - echo "Release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Aivory Warden $CI_COMMIT_TAG. Check the SHA-256 of a download against SHA256SUMS. Desktop bundles come from the GitHub release."
    assets:
      links:
        - name: SHA256SUMS
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aivory-warden/$CI_COMMIT_TAG/SHA256SUMS"
        - name: install.sh
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aivory-warden/$CI_COMMIT_TAG/install.sh"
        - name: install.ps1
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aivory-warden/$CI_COMMIT_TAG/install.ps1"
