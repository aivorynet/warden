stages: [check]

variables:
  CARGO_TERM_COLOR: always

.rust:
  stage: check
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace

check:linux:
  extends: .rust
  image: rust:1.95
  tags: [saas-linux-small-amd64]
  before_script:
    - rustup component add rustfmt clippy

check:macos:
  extends: .rust
  image: macos-14-xcode-15
  tags: [saas-macos-medium-m1]
  before_script:
    - curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0 --profile minimal -c rustfmt -c clippy
    - source "$HOME/.cargo/env"

check:windows:
  extends: .rust
  tags: [saas-windows-medium-amd64]
  before_script:
    - Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - ./rustup-init.exe -y --default-toolchain 1.95.0 --profile minimal -c rustfmt -c clippy
    - $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"

deny:
  stage: check
  image: rust:1.95
  tags: [saas-linux-small-amd64]
  script:
    - cargo install cargo-deny --locked
    - cargo deny check
