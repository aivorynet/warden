[workspace]
resolver = "3"
members = [
    "crates/warden-core",
    "crates/warden-vault",
    "crates/warden-providers",
    "crates/warden-sinks",
    "crates/warden-engine",
    "crates/warden-ipc",
    "crates/warden-mcp",
    "crates/warden-coffee",
    "crates/aivory-warden",
    "crates/warden-native-host",
    "apps/desktop/src-tauri",
]
# The Tauri app builds for minutes; build it with `-p aivory-warden-desktop` or `--workspace`.
default-members = [
    "crates/warden-core",
    "crates/warden-vault",
    "crates/warden-providers",
    "crates/warden-sinks",
    "crates/warden-engine",
    "crates/warden-ipc",
    "crates/warden-mcp",
    "crates/warden-coffee",
    "crates/aivory-warden",
    "crates/warden-native-host",
]

[workspace.package]
version = "2026.11.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
warden-core = { path = "crates/warden-core" }
warden-vault = { path = "crates/warden-vault" }
warden-providers = { path = "crates/warden-providers" }
warden-sinks = { path = "crates/warden-sinks" }
warden-engine = { path = "crates/warden-engine" }
warden-ipc = { path = "crates/warden-ipc" }
warden-mcp = { path = "crates/warden-mcp" }
warden-coffee = { path = "crates/warden-coffee" }
warden-native-host = { path = "crates/warden-native-host" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
rand = "0.9"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
