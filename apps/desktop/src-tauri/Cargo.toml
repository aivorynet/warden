[package]
name = "aivory-warden-desktop"
description = "Aivory Warden desktop app: a front end to the background daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gethostname = "1"
aivory-warden = { path = "../../../crates/aivory-warden" }
warden-core.workspace = true
warden-ipc.workspace = true
warden-verify.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tokio = { workspace = true, features = ["process", "time", "io-util"] }
chrono.workspace = true
open = "5"

[lints]
workspace = true
