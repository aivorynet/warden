[package]
name = "warden-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
warden-core.workspace = true
warden-ipc.workspace = true
rmcp = { version = "3.11.0", features = ["server", "transport-io", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
base64 = "0.22"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
url = "2"
async-trait = "0.1"
chrono.workspace = true

[dev-dependencies]
rmcp = { version = "3.11.0", features = ["client", "server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"

[lints]
workspace = true
