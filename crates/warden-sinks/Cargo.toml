[package]
name = "warden-sinks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
warden-core.workspace = true
async-trait = "0.1"
regex = "1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.22"
tokio = { version = "1", features = ["fs", "rt", "macros", "time", "net", "io-util"] }
russh = { version = "0.65", default-features = false, features = ["flate2", "ring"] }
russh-sftp = "4"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
