name = "aivory-coffee-receipt"
main = "src/index.ts"
compatibility_date = "2025-09-01"
account_id = "93c7bfed38d20c6678d153aa233505f3"

# Routes under aivory.net.
routes = [{ pattern = "aivory.net/coffee/*", zone_name = "aivory.net" }]

# Secrets (set with `wrangler secret put`, never store them here):
#   STRIPE_SECRET_KEY     Stripe secret key (sk_live_... or sk_test_...)
#   RECEIPT_SIGNING_KEY   Ed25519 private key, PKCS8 DER, base64
#   STRIPE_WEBHOOK_SECRET Stripe webhook signing secret (whsec_...)

# KV namespace for claims (created with `npx wrangler kv namespace create CLAIMS`).
[[kv_namespaces]]
binding = "CLAIMS"
id = "028cb9076f8a4537af091e3d25192283"
